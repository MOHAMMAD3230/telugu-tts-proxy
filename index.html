<style>
  :root{
    --bg:#0b1020; --panel:#121a33; --panel2:#0f1730; --line:#1f2b50;
    --txt:#e6ecff; --muted:#8ea0c8; --accent:#4ade80; --accent2:#38bdf8;
    --purple:#a78bfa; --warn:#fbbf24; --danger:#f87171; --ok:#22c55e;
    --radius:14px; --shadow:0 10px 30px rgba(0,0,0,.35);

  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:var(--sans); color:var(--txt); background:

      radial-gradient(800px 500px at 110% 10%, #1a2a55 0%, transparent 55%),

  }
  .wrap{max-width:1180px;margin:0 auto;padding:18px 16px 60px}
  header.top{
    display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
    padding:14px 16px;border-radius:var(--radius);border:1px solid var(--line);
    background:linear-gradient(180deg, rgba(255,255,255,.04), rgba(255,255,255,0));

  .logo{
    width:46px;height:46px;border-radius:12px;display:grid;place-items:center;

    font-size:22px;font-family:var(--telugu);box-shadow:0 6px 20px rgba(56,189,248,.35)
  }
  .brand h1{font-size:18px;line-height:1.2}
  .brand .sub{font-size:12px;color:var(--muted)}
  .top-actions{display:flex;gap:8px;flex-wrap:wrap}
  .btn{
    appearance:none;border:1px solid var(--line);background:var(--panel);color:var(--txt);
    padding:9px 14px;border-radius:10px;cursor:pointer;font-size:13px;font-weight:600;
    display:inline-flex;align-items:center;gap:6px;transition:.15s
  }
  .btn:hover{background:#1a2547;border-color:#2b3a6a;transform:translateY(-1px)}
  .btn.primary{background:linear-gradient(135deg,#38bdf8,#4ade80);color:#04122a;border:none;font-weight:700}
  .btn.mp3{background:linear-gradient(135deg,#a78bfa,#38bdf8);color:#04122a;border:none;font-weight:700}
  .btn.ghost{background:transparent}
  .btn.sm{padding:4px 9px;font-size:12px;border-radius:7px}
  .btn:disabled{opacity:.45;cursor:not-allowed;transform:none;filter:none}

  .grid{display:grid;grid-template-columns:1.05fr .95fr;gap:16px}

  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow)}

    transform:translateY(20px);opacity:0;pointer-events:none;transition:.2s;max-width:340px
  }

    .brand h1{font-size:15px}
    .top-actions .btn{padding:7px 10px;font-size:12px}
    .row label{min-width:100px}

</style>

<body>
<div class="wrap">

  <header class="top">
    <div class="brand">

      <div>

  <div class="grid">
    <!-- LEFT -->
    <section class="card">
      <h2><span class="title-left"><span class="dot"></span>Source PDF</span></h2>

      <label class="drop" id="drop" for="fileInput">
        <div class="big">📄</div>
        <p><b>Choose a PDF</b> or drag it here</p>
        <div class="formats">Text-based PDF · max 50 MB</div>
      </label>
      <input type="file" id="fileInput" accept="application/pdf,.pdf" />

      <div class="meta">
        <div class="item"><div class="k">File</div><div class="v" id="metaName">—</div></div>

      </div>

      <div class="row">

        <select id="pageRangeMode">

          <option value="custom">Custom range</option>

      </div>
      <div class="row" id="pageRangeRow" style="display:none">

      <div class="row">

      <div class="progress">

        <div class="stats"><span id="progressText">Ready</span><span id="progressPct">0%</span></div>
      </div>

      <div class="log" id="log"></div>
      <div class="cache-info">Cached blocks: <b id="cacheCount">0</b></div>
    </section>

    <!-- RIGHT -->
    <section class="card">
      <h2>
        <span class="title-left"><span class="dot"></span>Preview</span>
        <span class="preview-nav">
          <button class="btn sm ghost" id="prevPage" type="button">‹</button>
          <span id="pageIndicator" style="font-size:12px;color:var(--muted)">—</span>
          <button class="btn sm ghost" id="nextPage" type="button">›</button>

      <div class="preview">
        <div class="pane"><h3>English</h3><div class="en" id="previewEn">Upload a PDF to begin.</div></div>
        <div class="pane"><h3>తెలుగు</h3><div class="te" id="previewTe">—</div></div>
      </div>

      <div class="audio-box">

          <span class="title">🔊 Telugu audio</span>
          <span class="speed-btns">

</div>

<div class="toast" id="toast"></div>

<script>
(() => {
'use strict';

/* ------------------------------------------------------------------ config */

const CFG = {
  MAX_FILE_BYTES: 50 * 1024 * 1024,
  BATCH_SIZE: 60,
  BATCH_DELAY_MS: 400,
  PROXY: 'https://telugu-tts-proxy.mohammadashrafali96.workers.dev',
  PDF_RENDER_SCALE: 2,
  MAX_MP3_CHUNKS: 1500,
  TTS_CHUNK_CHARS: 190,
  TTS_CONCURRENCY: 6,
};

/* ------------------------------------------------------------------- state */

const S = {
  file: null,
  pages: [],
  translatedPages: [],
  previewIdx: 0,
  isBusy: false,
  cancel: false,
  outputBlob: null,
  audioBlob: null,
  audioUrl: null,
};

/* --------------------------------------------------------------------- dom */

const $ = (id) => document.getElementById(id);
const ui = {
  drop: $('drop'), fileInput: $('fileInput'),
  metaName: $('metaName'), metaSize: $('metaSize'), metaPages: $('metaPages'), metaStatus: $('metaStatus'),
  pageRangeMode: $('pageRangeMode'), pageRangeRow: $('pageRangeRow'), pageFrom: $('pageFrom'), pageTo: $('pageTo'),
  bilingual: $('bilingual'), fontSize: $('fontSize'), workers: $('workers'),
  convertBtn: $('convertBtn'), cancelBtn: $('cancelBtn'),
  progressBar: $('progressBar'), progressText: $('progressText'), progressPct: $('progressPct'),
  log: $('log'), cacheCount: $('cacheCount'),
  previewEn: $('previewEn'), previewTe: $('previewTe'),
  pageIndicator: $('pageIndicator'), prevPage: $('prevPage'), nextPage: $('nextPage'),
  audio: $('audio'),
  downloadPdfBtn: $('downloadPdfBtn'), generateMp3Btn: $('generateMp3Btn'), downloadMp3Btn: $('downloadMp3Btn'),
  testTtsBtn: $('testTtsBtn'), clearCacheBtn: $('clearCacheBtn'),
  toast: $('toast'),
};

/* ------------------------------------------------------------------- utils */

const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const nextFrame = () => new Promise((r) => requestAnimationFrame(() => r()));

function log(msg, cls) {
  const line = document.createElement('div');
  if (cls) line.className = cls;
  line.textContent = '[' + new Date().toLocaleTimeString() + '] ' + msg;
  ui.log.appendChild(line);
  while (ui.log.childElementCount > 150) ui.log.removeChild(ui.log.firstChild);
  ui.log.scrollTop = ui.log.scrollHeight;
}

let _toastTimer;
function toast(msg) {
  ui.toast.textContent = msg;
  ui.toast.classList.add('show');
  clearTimeout(_toastTimer);
  _toastTimer = setTimeout(() => ui.toast.classList.remove('show'), 4500);
}

function setProgress(pct, text) {
  const p = Math.max(0, Math.min(100, Math.round(pct)));
  ui.progressBar.style.width = p + '%';
  ui.progressPct.textContent = p + '%';
  if (text) ui.progressText.textContent = text;
}

function formatBytes(n) {
  if (n < 1024) return n + ' B';
  if (n < 1048576) return (n / 1024).toFixed(0) + ' KB';
  return (n / 1048576).toFixed(1) + ' MB';
}

function sanitizeFilename(name) {
  return String(name)
    .replace(/[\/\\:*?"<>|\u0000-\u001f]/g, '_')
    .replace(/^\.+/, '')
    .slice(0, 120) || 'document';
}

/* ------------------------------------------------------------------- cache */

const DB_NAME = 'te-translate-cache';
const STORE = 'pairs';
let _db = null;

function openCache() {
  return new Promise((resolve) => {
    if (_db) return resolve(_db);
    try {
      const req = indexedDB.open(DB_NAME, 1);
      req.onupgradeneeded = () => {
        const db = req.result;
        if (!db.objectStoreNames.contains(STORE)) db.createObjectStore(STORE);
      };
      req.onsuccess = () => { _db = req.result; resolve(_db); };
      req.onerror = () => resolve(null);
    } catch (e) { resolve(null); }
  });
}

async function cacheGet(key) {
  const db = await openCache();
  if (!db) return null;
  return new Promise((resolve) => {
    try {
      const r = db.transaction(STORE, 'readonly').objectStore(STORE).get(key);
      r.onsuccess = () => resolve(r.result || null);
      r.onerror = () => resolve(null);
    } catch (e) { resolve(null); }
  });
}

async function cachePut(key, value) {
  const db = await openCache();
  if (!db) return;
  try {
    db.transaction(STORE, 'readwrite').objectStore(STORE).put(value, key);
  } catch (e) {}
}

async function clearCache() {
  const db = await openCache();
  if (!db) return;
  await new Promise((resolve) => {
    const tx = db.transaction(STORE, 'readwrite');
    tx.objectStore(STORE).clear();
    tx.oncomplete = resolve;
    tx.onerror = resolve;
  });
  await refreshCacheStats();
  log('Cache cleared.', 'ok');
  toast('Cache cleared.');
}

async function refreshCacheStats() {
  const db = await openCache();
  if (!db) return;
  try {
    const r = db.transaction(STORE, 'readonly').objectStore(STORE).count();
    r.onsuccess = () => { ui.cacheCount.textContent = r.result; };
  } catch (e) {}
}

/* -------------------------------------------------------------- translation */

let _trFailLogged = 0;
function logTrFail(msg) {
  if (_trFailLogged >= 3) return;
  _trFailLogged++;
  log('Translate failed: ' + msg, 'err');
  if (_trFailLogged === 1) toast('Translation is failing — check the Worker /translate route.');
}

async function workerTranslate(texts, target) {
  const r = await fetch(CFG.PROXY + '/translate', {
    method: 'POST',
    headers: { 'content-type': 'application/json' },
    body: JSON.stringify({ texts, target: target || 'te' }),
  });
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.error || ('proxy HTTP ' + r.status));
  if (!Array.isArray(data.translations) || data.translations.length !== texts.length) {
    throw new Error('bad proxy response');
  }
  if (Array.isArray(data.errors) && data.errors.length) throw new Error(data.errors[0]);
  return data.translations;
}

async function gtxSingle(text) {
  const out = await workerTranslate([text]);
  return out[0];
}

async function gtxBatch(texts) {
  return workerTranslate(texts);
}

async function translateParagraph(text, attempt) {
  attempt = attempt || 0;
  if (S.cancel) return text;
  const cached = await cacheGet(text);
  if (cached) return cached;
  try {
    const tr = await gtxSingle(text);
    if (tr && tr.trim() && tr.trim() !== text.trim()) {
      await cachePut(text, tr);
      return tr;
    }
    throw new Error('empty translation');
  } catch (e) {
    if (S.cancel) return text;
    if (attempt < 1) { await sleep(500); return translateParagraph(text, attempt + 1); }
    logTrFail(String((e && e.message) || e));
    return text;
  }
}

function packBatches(tasks) {
  const MAX_Q = 8;
  const MAX_CHARS = 1200;
  const batches = [];
  let cur = [];
  let chars = 0;
  for (const t of tasks) {
    if (cur.length && (cur.length >= MAX_Q || chars + t.en.length > MAX_CHARS)) {
      batches.push(cur); cur = []; chars = 0;
    }
    cur.push(t);
    chars += t.en.length;
  }
  if (cur.length) batches.push(cur);
  return batches;
}

async function translateTasks(tasks, concurrency, onDone) {
  const pending = [];
  for (const t of tasks) {
    const cached = await cacheGet(t.en);
    if (cached) { t.te = cached; onDone(t); } else pending.push(t);
  }
  if (!pending.length) return;

  const batches = packBatches(pending);
  await pool(batches, concurrency, async (batch) => {
    if (S.cancel) return;
    let results = null;
    try {
      results = await gtxBatch(batch.map((t) => t.en));
    } catch (e) {
      logTrFail(String((e && e.message) || e));
    }
    for (let i = 0; i < batch.length; i++) {
      if (S.cancel) return;
      const t = batch[i];
      let te = results ? results[i] : null;
      if (te && te.trim() && te.trim() !== t.en.trim()) {
        await cachePut(t.en, te);
      } else {
        te = await translateParagraph(t.en);
      }
      t.te = te || t.en;
      onDone(t);
    }
  }, 0);
}

async function pool(items, workerCount, fn, delayMs) {
  const queue = items.slice();
  const n = Math.max(1, Math.min(workerCount, queue.length || 1));
  const runners = [];
  for (let k = 0; k < n; k++) {
    runners.push((async () => {
      while (queue.length) {
        if (S.cancel) return;
        const item = queue.shift();
        await fn(item);
        if (delayMs) await sleep(delayMs);
      }
    })());
  }
  await Promise.all(runners);
}

/* ------------------------------------------------------------ pdf extraction */

function securityCheck(file) {
  if (!file) return { ok: false, reason: 'No file selected.' };
  if (file.size > CFG.MAX_FILE_BYTES) {
    return { ok: false, reason: 'File is ' + formatBytes(file.size) + ' — limit is 50 MB.' };
  }
  const isPdf = file.type === 'application/pdf' || /\.pdf$/i.test(file.name);
  if (!isPdf) return { ok: false, reason: 'That is not a PDF file.' };
  return { ok: true };
}

function verifyPdfMagic(buffer) {
  const head = new Uint8Array(buffer.slice(0, 5));
  return String.fromCharCode.apply(null, head) === '%PDF-';
}

function pushSplitParagraph(arr, text) {
  const clean = String(text).replace(/\s+/g, ' ').trim();
  if (!clean) return;
  if (clean.length <= 900) { arr.push(clean); return; }
  const parts = clean.match(/[^.!?]+[.!?]+(?:\s+|$)|[^.!?]+$/g) || [clean];
  let buf = '';
  for (const p of parts) {
    const s = p.trim();
    if (!s) continue;
    if ((buf + ' ' + s).trim().length <= 900) buf = (buf ? buf + ' ' + s : s).trim();
    else { if (buf) arr.push(buf); buf = s; }
  }
  if (buf) arr.push(buf);
}

function extractStructuredPage(items, viewportHeight) {
  const raw = [];
  for (const it of items) {
    if (!it || typeof it.str !== 'string') continue;
    const str = it.str.replace(/\s+/g, ' ').trim();
    if (!str) continue;
    const t = it.transform || [1, 0, 0, 1, 0, 0];
    const fs = Math.abs(t[3]) || Math.abs(t[0]) || 10;
    raw.push({ str: str, x: t[4], y: viewportHeight - t[5], fs: fs });
  }
  if (!raw.length) return { paragraphs: [] };

  raw.sort((a, b) => (Math.abs(a.y - b.y) > 2 ? a.y - b.y : a.x - b.x));

  const lines = [];
  let cur = null;
  for (const o of raw) {
    if (!cur) { cur = { y: o.y, fs: o.fs, items: [o] }; continue; }
    const tol = Math.max(cur.fs, o.fs) * 0.45;
    if (Math.abs(o.y - cur.y) <= tol) {
      cur.items.push(o);
      cur.fs = Math.max(cur.fs, o.fs);
    } else {
      lines.push(cur);
      cur = { y: o.y, fs: o.fs, items: [o] };
    }
  }
  if (cur) lines.push(cur);

  const paragraphs = [];
  let buf = '';
  let lastFs = 0;
  let lastY = 0;

  for (const ln of lines) {
    ln.items.sort((a, b) => a.x - b.x);
    const text = ln.items.map((i) => i.str).join(' ').replace(/\s+/g, ' ').trim();
    if (!text) continue;
    const gap = lastY ? ln.y - lastY : 0;
    const newPara = !buf || Math.abs(ln.fs - lastFs) > 1.5 || gap > ln.fs * 1.8;
    if (newPara && buf) { pushSplitParagraph(paragraphs, buf); buf = text; }
    else buf = buf ? buf + ' ' + text : text;
    lastFs = ln.fs;
    lastY = ln.y;
  }
  if (buf) pushSplitParagraph(paragraphs, buf);
  return { paragraphs: paragraphs };
}

async function handleFile(file) {
  if (S.isBusy) return;
  if (!window.pdfjsLib) {
    log('pdf.js failed to load — check your network / CDN.', 'err');
    toast('pdf.js could not load.');
    return;
  }
  const check = securityCheck(file);
  if (!check.ok) { log(check.reason, 'err'); toast(check.reason); return; }

  resetState();
  S.file = file;
  ui.metaName.textContent = file.name;
  ui.metaSize.textContent = formatBytes(file.size);
  ui.metaStatus.textContent = 'Reading…';
  log('Loading ' + file.name, 'warn');

  try {
    const buffer = await file.arrayBuffer();
    if (!verifyPdfMagic(buffer)) {
      log('File does not start with %PDF- — refusing to parse.', 'err');
      ui.metaStatus.textContent = 'Invalid';
      return;
    }

    const pdf = await pdfjsLib.getDocument({
      data: new Uint8Array(buffer),
      isEvalSupported: false,
    }).promise;

    const total = pdf.numPages;
    ui.metaPages.textContent = total;
    ui.pageTo.value = Math.min(total, 20);
    ui.pageTo.max = total;
    ui.pageFrom.max = total;

    const pages = [];
    for (let i = 1; i <= total; i++) {
      const page = await pdf.getPage(i);
      const viewport = page.getViewport({ scale: 1 });
      const content = await page.getTextContent();
      const structured = extractStructuredPage(content.items, viewport.height);
      pages.push({ pageIdx: i - 1, paragraphs: structured.paragraphs });
      page.cleanup();
      if (i % 10 === 0) {
        ui.metaStatus.textContent = 'Reading ' + i + '/' + total;
        await nextFrame();
      }
    }

    S.pages = pages;
    const withText = pages.filter((p) => p.paragraphs.length).length;
    ui.metaStatus.textContent = withText ? 'Ready' : 'No text';
    log('Extracted ' + withText + '/' + total + ' page(s) with text.', 'ok');
    if (!withText) {
      toast('No selectable text — this looks like a scanned PDF.');
      return;
    }
    setButtonsBusy(false);
    ui.convertBtn.disabled = false;
  } catch (e) {
    log('Failed to read PDF: ' + (e.message || e), 'err');
    ui.metaStatus.textContent = 'Error';
    toast('Could not read that PDF.');
  }
}

/* ---------------------------------------------------------------- pdf build */

async function ensureTeluguFontLoaded() {
  if (!document.fonts) return;
  try { await document.fonts.load('14px "Noto Sans Telugu"'); } catch (e) {}
}

function wrapLines(ctx, text, maxWidth) {
  const words = String(text).split(/\s+/);
  const lines = [];
  let cur = '';
  for (const w of words) {
    const test = cur ? cur + ' ' + w : w;
    if (ctx.measureText(test).width > maxWidth && cur) { lines.push(cur); cur = w; }
    else cur = test;
  }
  if (cur) lines.push(cur);
  return lines.length ? lines : [''];
}

async function buildTeluguPdfBlob(onProgress) {
  const jsPDFCtor = window.jspdf && window.jspdf.jsPDF;
  if (!jsPDFCtor) throw new Error('jsPDF not loaded');

  const doc = new jsPDFCtor({ unit: 'pt', format: 'a4', compress: true });
  const pageWpt = doc.internal.pageSize.getWidth();
  const pageHpt = doc.internal.pageSize.getHeight();
  const marginPt = 48;
  const scale = CFG.PDF_RENDER_SCALE;
  const marginPx = marginPt * scale;
  const usableWPx = (pageWpt - marginPt * 2) * scale;
  const usableHPx = (pageHpt - marginPt * 2) * scale;
  const bilingual = ui.bilingual.checked;
  const teluguPt = parseInt(ui.fontSize.value, 10) || 14;

  const canvas = document.createElement('canvas');
  canvas.width = Math.round(pageWpt * scale);
  canvas.height = Math.round(pageHpt * scale);
  const ctx = canvas.getContext('2d');

  await ensureTeluguFontLoaded();

  let pagesAdded = 0;
  let y = marginPx;
  let pageStarted = false;

  function resetPage() {
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    y = marginPx;
    pageStarted = false;
  }

  function flush() {
    if (!pageStarted) return;
    if (pagesAdded > 0) doc.addPage();
    const img = canvas.toDataURL('image/jpeg', 0.85);
    doc.addImage(img, 'JPEG', 0, 0, pageWpt, pageHpt, undefined, 'FAST');
    pagesAdded++;
    resetPage();
  }

  resetPage();

  const ordered = S.translatedPages.slice().sort((a, b) => a.pageIdx - b.pageIdx);
  let donePages = 0;

  for (const page of ordered) {
    if (S.cancel) throw new Error('cancelled');
    for (const p of page.paragraphs) {
      if (!p || !p.te) continue;

      const colW = bilingual ? usableWPx * 0.48 : usableWPx;
      const rightX = marginPx + usableWPx * 0.52;

      if (bilingual) {
        ctx.fillStyle = '#555555';
        ctx.font = Math.round(11 * scale) + "px 'Segoe UI', system-ui, sans-serif";
        const enLines = wrapLines(ctx, p.en, colW);
        const enLineH = 11 * scale * 1.5;
        for (const line of enLines) {
          if (y + enLineH > marginPx + usableHPx) flush();
          ctx.fillText(line, marginPx, y);
          y += enLineH;
        }
      }

      ctx.fillStyle = '#111111';
      ctx.font = Math.round(teluguPt * scale) + "px 'Noto Sans Telugu', 'Gautami', sans-serif";
      const teLines = wrapLines(ctx, p.te, colW);
      const teLineH = teluguPt * scale * 1.7;
      let ty = bilingual ? marginPx : y;

      for (const line of teLines) {
        if (ty + teLineH > marginPx + usableHPx) {
          flush();
          ty = marginPx;
        }
        ctx.fillText(line, bilingual ? rightX : marginPx, ty);
        ty += teLineH;
      }

      y = Math.max(y, ty) + 8 * scale;
      pageStarted = true;
    }

    donePages++;
    if (onProgress) onProgress(donePages);
    await nextFrame();
  }

  flush();
  return doc.output('blob');
}

/* --------------------------------------------------------------------- tts */

function getAllTranslatedText() {
  return S.translatedPages
    .slice()
    .sort((a, b) => a.pageIdx - b.pageIdx)
    .map((p) => p.paragraphs.filter(Boolean).map((x) => x.te).join(' '))
    .filter(Boolean)
    .join('\n\n');
}

function splitChunks(text, maxLen) {
  const clean = String(text).replace(/\s+/g, ' ').trim();
  if (!clean) return [];
  const sentences = clean.match(/[^.!?।]+[.!?।]*(?:\s+|$)/g) || [clean];
  const out = [];
  let buf = '';
  for (const s of sentences) {
    const t = s.trim();
    if (!t) continue;
    if ((buf + ' ' + t).trim().length <= maxLen) {
      buf = (buf ? buf + ' ' + t : t).trim();
    } else {
      if (buf) out.push(buf);
      if (t.length <= maxLen) {
        buf = t;
      } else {
        const words = t.split(' ');
        let w = '';
        for (const word of words) {
          if ((w + ' ' + word).trim().length <= maxLen) w = (w ? w + ' ' + word : word).trim();
          else { if (w) out.push(w); w = word; }
        }
        buf = w;
      }
    }
  }
  if (buf) out.push(buf);
  return out;
}

async function fetchTtsChunk(text, idx, total) {
  const url = CFG.PROXY + '/tts?q=' + encodeURIComponent(text) +
    '&tl=te&idx=' + idx + '&total=' + total;
  const res = await fetch(url);
  if (!res.ok) {
    let detail = '';
    try { const j = await res.json(); detail = j.error || ''; } catch (e) {}
    throw new Error('TTS HTTP ' + res.status + (detail ? ' — ' + detail : ''));
  }
  const buf = await res.arrayBuffer();
  if (buf.byteLength < 200) throw new Error('TTS chunk too small');
  return buf;
}

async function generateAudio() {
  if (S.isBusy) return;
  const text = getAllTranslatedText();
  if (!text) { toast('Translate the PDF first.'); return; }

  S.isBusy = true;
  S.cancel = false;
  setButtonsBusy(true);
  log('Building Telugu audio…', 'warn');

  try {
    let chunks = splitChunks(text, CFG.TTS_CHUNK_CHARS);
    if (chunks.length > CFG.MAX_MP3_CHUNKS) {
      log('Capping at ' + CFG.MAX_MP3_CHUNKS + ' chunks (of ' + chunks.length + ').', 'warn');
      chunks = chunks.slice(0, CFG.MAX_MP3_CHUNKS);
    }
    log(chunks.length + ' audio chunk(s).', 'warn');

    const buffers = new Array(chunks.length);
    let done = 0;

    const items = chunks.map((c, i) => ({ text: c, i: i }));
    await pool(items, CFG.TTS_CONCURRENCY, async (item) => {
      buffers[item.i] = await fetchTtsChunk(item.text, item.i, chunks.length);
      done++;
      setProgress((done / chunks.length) * 100, 'Audio ' + done + '/' + chunks.length);
    }, 0);

    const blob = new Blob(buffers, { type: 'audio/mpeg' });
    S.audioBlob = blob;

    if (S.audioUrl) URL.revokeObjectURL(S.audioUrl);
    S.audioUrl = URL.createObjectURL(blob);
    ui.audio.src = S.audioUrl;

    log('MP3 ready: ' + formatBytes(blob.size), 'ok');
    setProgress(100, 'Done');
    toast('Telugu MP3 ready.');
  } catch (e) {
    log('Audio failed: ' + (e.message || e), 'err');
    toast('Audio generation failed — see log.');
  } finally {
    S.isBusy = false;
    setButtonsBusy(false);
  }
}

/* --------------------------------------------------------------- downloads */

async function verifyBlob(kind, blob) {
  if (!blob || !blob.size) return false;
  if (kind === 'pdf') {
    const head = new Uint8Array(await blob.slice(0, 5).arrayBuffer());
    return String.fromCharCode.apply(null, head) === '%PDF-';
  }
  return blob.size > 1000;
}

function triggerBlobDownload(blob, filename) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  a.rel = 'noopener';
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 120000);
}

async function secureDownload(kind) {
  const base = sanitizeFilename((S.file && S.file.name ? S.file.name : 'document').replace(/\.pdf$/i, ''));
  const blob = kind === 'pdf' ? S.outputBlob : S.audioBlob;
  const name = base + (kind === 'pdf' ? '-telugu.pdf' : '-telugu.mp3');

  if (!blob) { toast('Nothing to download yet.'); return; }
  const ok = await verifyBlob(kind, blob);
  if (!ok) { log('Download blocked: file failed integrity check.', 'err'); toast('File failed verification.'); return; }

  triggerBlobDownload(blob, name);
  log('Downloaded ' + name + ' (' + formatBytes(blob.size) + ')', 'ok');
}

/* -------------------------------------------------------------------- flow */

function hasTranslation() {
  return S.translatedPages.some((p) => p.paragraphs.some((x) => x && x.te));
}

function setButtonsBusy(busy) {
  ui.convertBtn.disabled = busy || !S.pages.length;
  ui.cancelBtn.disabled = !busy;
  ui.generateMp3Btn.disabled = busy || !hasTranslation();
  ui.downloadPdfBtn.disabled = busy || !S.outputBlob;
  ui.downloadMp3Btn.disabled = busy || !S.audioBlob;
}

function resetState() {
  S.cancel = true;
  S.pages = [];
  S.translatedPages = [];
  S.previewIdx = 0;
  S.outputBlob = null;
  S.audioBlob = null;
  if (S.audioUrl) { URL.revokeObjectURL(S.audioUrl); S.audioUrl = null; }
  ui.audio.removeAttribute('src');
  ui.previewEn.textContent = 'Upload a PDF to begin.';
  ui.previewTe.textContent = '—';
  ui.pageIndicator.textContent = '—';
  ui.metaPages.textContent = '—';
  ui.metaStatus.textContent = 'Idle';
  setProgress(0, 'Ready');
  setButtonsBusy(false);
  ui.convertBtn.disabled = true;
}

function parsePageRange(total) {
  if (ui.pageRangeMode.value === 'all') return { start: 0, end: total - 1 };
  let from = Math.max(1, parseInt(ui.pageFrom.value, 10) || 1);
  let to = Math.min(total, parseInt(ui.pageTo.value, 10) || total);
  if (to < from) to = from;
  return { start: from - 1, end: to - 1 };
}

function showPreview(idx) {
  if (!S.translatedPages.length) return;
  S.previewIdx = Math.max(0, Math.min(idx, S.translatedPages.length - 1));
  const pg = S.translatedPages[S.previewIdx];
  const paras = pg.paragraphs.filter(Boolean);
  ui.previewEn.textContent = paras.map((p) => p.en).join('\n\n') || '(empty page)';
  ui.previewTe.textContent = paras.map((p) => p.te || '…').join('\n\n') || '(empty page)';
  ui.pageIndicator.textContent = 'Page ' + (pg.pageIdx + 1) + ' / ' + S.pages.length;
}

async function convert() {
  if (S.isBusy || !S.pages.length) return;

  S.isBusy = true;
  S.cancel = false;
  _trFailLogged = 0;
  setButtonsBusy(true);
  const t0 = performance.now();

  try {
    const range = parsePageRange(S.pages.length);
    const workers = Math.max(1, Math.min(8, parseInt(ui.workers.value, 10) || 4));

    const pageMap = new Map();
    for (const tp of S.translatedPages) if (tp) pageMap.set(tp.pageIdx, tp);

    for (let i = range.start; i <= range.end; i++) {
      const count = (S.pages[i] && S.pages[i].paragraphs ? S.pages[i].paragraphs.length : 0);
      const existing = pageMap.get(i);
      if (existing && Array.isArray(existing.paragraphs) && existing.paragraphs.length === count) continue;
      const merged = new Array(count).fill(null);
      if (existing && Array.isArray(existing.paragraphs)) {
        for (let k = 0; k < Math.min(count, existing.paragraphs.length); k++) merged[k] = existing.paragraphs[k];
      }
      pageMap.set(i, { pageIdx: i, paragraphs: merged });
    }

    const allTasks = [];
    for (let i = range.start; i <= range.end; i++) {
      const src = (S.pages[i] && S.pages[i].paragraphs) || [];
      for (let p = 0; p < src.length; p++) allTasks.push({ pageIdx: i, pIdx: p, en: src[p] });
    }

    if (!allTasks.length) { toast('No text in the selected pages.'); return; }

    let completed = 0;
    for (const task of allTasks) {
      const e = pageMap.get(task.pageIdx);
      if (e && e.paragraphs[task.pIdx] && e.paragraphs[task.pIdx].te) completed++;
    }

    const batchTasks = allTasks.filter((t) => {
      const e = pageMap.get(t.pageIdx);
      return !(e && e.paragraphs[t.pIdx] && e.paragraphs[t.pIdx].te);
    });

    log('Translating ' + allTasks.length + ' block(s) across ' +
      (range.end - range.start + 1) + ' page(s)…', 'warn');

    const batches = [];
    for (let i = 0; i < batchTasks.length; i += CFG.BATCH_SIZE) {
      batches.push(batchTasks.slice(i, i + CFG.BATCH_SIZE));
    }

    for (let b = 0; b < batches.length; b++) {
      if (S.cancel) break;

      await translateTasks(batches[b], workers, (task) => {
        const entry = pageMap.get(task.pageIdx);
        if (entry) entry.paragraphs[task.pIdx] = { en: task.en, te: task.te };
        completed++;
        const pct = Math.min(78, 2 + Math.round((completed / Math.max(1, allTasks.length)) * 76));
        const elapsed = Math.max(0.2, (performance.now() - t0) / 1000);
        const rate = completed / elapsed;
        const eta = Math.max(0, Math.round((allTasks.length - completed) / Math.max(0.1, rate)));
        setProgress(pct, 'Batch ' + (b + 1) + '/' + batches.length + ' · ' +
          completed + '/' + allTasks.length + ' blocks · ETA ' + eta + 's');
        if (completed % 24 === 0) {
          S.translatedPages = Array.from(pageMap.values()).sort((x, y) => x.pageIdx - y.pageIdx);
          showPreview(S.previewIdx);
        }
      });

      S.translatedPages = Array.from(pageMap.values()).sort((x, y) => x.pageIdx - y.pageIdx);
      showPreview(S.previewIdx);
      if (b < batches.length - 1) await sleep(CFG.BATCH_DELAY_MS);
    }

    S.translatedPages = Array.from(pageMap.values()).sort((x, y) => x.pageIdx - y.pageIdx);

    const translated = S.translatedPages.reduce(
      (n, p) => n + p.paragraphs.filter((x) => x && x.te).length, 0);
    log('Translated ' + translated + ' block(s).', 'ok');

    setProgress(78, 'Rendering PDF…');
    const blob = await buildTeluguPdfBlob((done) => {
      setProgress(78 + Math.round((done / Math.max(1, S.translatedPages.length)) * 20),
        'Rendering PDF ' + done + '/' + S.translatedPages.length);
    });

    S.outputBlob = blob;
    log('PDF ready: ' + formatBytes(blob.size), 'ok');
    setProgress(100, 'Done');
    toast('Telugu PDF ready.');
    showPreview(S.previewIdx);
  } catch (e) {
    if (String(e && e.message) === 'cancelled') log('Cancelled.', 'warn');
    else { log('Convert failed: ' + ((e && e.message) || e), 'err'); toast('Convert failed — see log.'); }
  } finally {
    S.isBusy = false;
    setButtonsBusy(false);
  }
}
