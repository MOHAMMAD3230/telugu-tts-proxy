<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Page not found — Telugu PDF Converter</title>
<meta name="robots" content="noindex" />
<style>
  :root{--bg:#0b1020;--panel:#121a33;--line:#1f2b50;--txt:#e6ecff;--muted:#8ea0c8;--accent2:#38bdf8}
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    min-height:100vh;display:grid;place-items:center;padding:24px;
    font-family:'Segoe UI',system-ui,-apple-system,Roboto,sans-serif;
    color:var(--txt);background:
      radial-gradient(900px 500px at 10% -10%, #16224a 0%, transparent 60%),
      radial-gradient(800px 500px at 110% 10%, #1a2a55 0%, transparent 55%),
      var(--bg);
  }
  .card{
    max-width:460px;width:100%;text-align:center;padding:36px 26px;
    background:var(--panel);border:1px solid var(--line);border-radius:14px;
    box-shadow:0 10px 30px rgba(0,0,0,.35);
  }
  .code{font-size:56px;font-weight:800;color:var(--accent2);line-height:1}
  h1{font-size:18px;margin:12px 0 8px}
  p{color:var(--muted);font-size:14px;line-height:1.6}
  a{
    display:inline-block;margin-top:20px;padding:11px 20px;border-radius:10px;
    background:linear-gradient(135deg,#38bdf8,#4ade80);color:#04122a;
    font-weight:700;font-size:14px;text-decoration:none;
  }
  a:hover{filter:brightness(1.08)}
</style>
</head>
<body>
  <div class="card">
    <div class="code">404</div>
    <h1>This page doesn't exist</h1>
    <p>The converter lives at the homepage. Nothing was lost — your files are never uploaded anywhere.</p>
    <a href="/">Go to the converter</a>
  </div>
</body>
</html>
